name: workflow.yml
on:
  workflow_dispatch:

jobs:
  prime-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🚀 GHOST MODE ACTIVATED
        env:
          ZEPH_WALLET: ${{ secrets.ZEPH_WALLET }}
          GH_PAT: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          chmod +x ./worker_prime.sh
          ./worker_prime.sh
