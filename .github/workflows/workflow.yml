name: Prime Otonom Logic
on:
  workflow_dispatch:

jobs:
  prime-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🚀 GHOST MODE ACTIVATED
        env:
          ZEPH_WALLET: ${{ secrets.ZEPH_WALLET }}
          TAILSCALE_AUTH: ${{ secrets.TAILSCALE_AUTH }}
        run: |
          # Dosyaların nerede olduğunu kontrol et (Debug amaçlı)
          ls -la
          
          # Dosya yolunu net bir şekilde belirtelim
          chmod +x ./worker_prime.sh
          ./worker_prime.sh
          
          sleep 21600
